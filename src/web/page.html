<!doctype html>
<meta charset="utf-8">
<title>Moniteur réseau</title>
<style>
  body { font-family: sans-serif; max-width: 800px; margin: 1em auto; padding: 0 1em; }
  td { padding: 4px 12px 4px 0; }
  pre { background: #f4f4f4; padding: .5em; }
</style>

<h1>Moniteur réseau</h1>

<h3>Cibles surveillées</h3>
<p>
  <input id="new-target" size="30" placeholder="10.0.2.2:8000"
         onkeydown="if (event.key === 'Enter') addTarget()">
  <button onclick="addTarget()">Ajouter la cible</button>
  <span id="target-message"></span>
</p>
<table id="targets"></table>
<p id="summary"></p>

<h3>Derniers rapports</h3>
<ul id="reports"></ul>
<pre id="report" hidden></pre>

<p>
  <button onclick="dumpNow()">Dump info now!</button>
  <span id="dump-message"></span>
</p>

<script>
const byId = id => document.getElementById(id);
const getJson = async url => (await fetch(url)).json();

async function post(url, body) {
  const r = await fetch(url, { method: 'POST', body });
  const data = await r.json().catch(() => ({}));
  return { ok: r.ok, error: data.error || r.status };
}

async function addTarget() {
  const input = byId('new-target');
  const r = await post('/api/targets/add', input.value.trim());
  byId('target-message').textContent = r.ok ? '✓ ajoutée' : '✗ ' + r.error;
  if (r.ok) input.value = '';
  refresh();
}

async function removeTarget(target) {
  await post('/api/targets/remove', target);
  refresh();
}

async function dumpNow() {
  const r = await post('/api/report');
  byId('dump-message').textContent = r.ok ? '✓ rapport créé' : '✗ ' + r.error;
  setTimeout(refresh, 500);
}

async function showReport(name) {
  const report = await getJson('/api/reports/' + name);
  byId('report').hidden = false;
  byId('report').textContent = name + '\n' + JSON.stringify(report, null, 2);
}

function targetRow(target, ping) {
  const value = ping && ping.last && ping.last.value;
  const cells = !ping
    ? ['⏳', target, 'première mesure en cours', '']
    : value != null
      ? ['🟢', target, value.toFixed(1) + ' ms', `perte ${ping.stats.loss_percent.toFixed(0)} %`]
      : ['🔴', target, 'injoignable', `perte ${ping.stats.loss_percent.toFixed(0)} %`];

  const row = document.createElement('tr');
  for (const text of cells) {
    row.insertCell().textContent = text;
  }
  const remove = document.createElement('button');
  remove.textContent = 'Supprimer';
  remove.onclick = () => removeTarget(target);
  row.insertCell().append(remove);
  return row;
}

async function refresh() {
  const d = await getJson('/api/status');
  byId('targets').replaceChildren(...d.targets.map(t => targetRow(t, d.pings[t])));

  const bw = d.bandwidth.last && d.bandwidth.last.value;
  byId('summary').textContent =
    'Débit : ' + (bw != null ? bw.toFixed(1) + ' Mb/s' : 'mesure en cours') +
    ` — uptime : ${d.uptime_s} s — rapports écrits : ${d.reports_written}`;

  const names = (await getJson('/api/reports')).slice(-5).reverse();
  byId('reports').innerHTML = names
    .map(n => `<li><a href="#" onclick="showReport('${n}')">${n}</a></li>`)
    .join('');
}

refresh();
setInterval(refresh, 2000);
</script>
